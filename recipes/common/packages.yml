---
# System-level software layered into the image. Anything here updates with
# the image itself, so it must not be a tool that self-updates in place.
modules:
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        # Remote help. Installed but never signed in: whoever looks after a
        # machine signs it in to their own tailnet (see the Remote Help
        # document each account gets). tailscaled runs but does nothing
        # until then.
        - tailscale
        # Mail, as in the studio edition, for families who use a desktop
        # mail program rather than webmail.
        - thunderbird
        # Desktop layout: native Fedora packages track the shipped GNOME
        # version, so they break far less often than extensions.gnome.org builds
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-appindicator
        # Family Setup is a small GTK 4 / libadwaita app; these are in the
        # Silverblue base today and listed so a base change cannot drop them.
        - python3-gobject
        - libadwaita
        # Used by sv-gpu-image, sv-update and the first-login script
        - jq
        # `fastfetch` system summary with the Shattered Vales logo
        - fastfetch
        - pciutils
        - libnotify

  # Full video playback. Fedora ships no H.264/HEVC decoder, so without
  # these Firefox cannot play ordinary MP4 video on news and social sites
  # (streaming services decode inside their own DRM module and work
  # either way). The freeworld VA-API driver adds hardware decoding on AMD
  # and Intel graphics, which saves battery on laptops. RPM Fusion is
  # removed again after the build, so it never appears as a repository on
  # family machines; the packages update with each new image.
  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      # RPM Fusion can trail a Fedora Mesa update by a few days; skipping a
      # broken freeworld driver for one nightly build is better than no
      # build at all. libavcodec-freeworld is gated in verify-image.sh.
      skip-broken: true
      packages:
        - libavcodec-freeworld
        - mesa-va-drivers-freeworld
