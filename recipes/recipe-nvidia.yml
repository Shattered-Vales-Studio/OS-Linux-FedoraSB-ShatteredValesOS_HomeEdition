# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Shattered Vales OS Home Edition for machines with NVIDIA graphics.
# All shared configuration lives in recipes/common so the base and NVIDIA
# images can never drift apart; only the base image differs.
name: shatteredvales-os-home-nvidia
description: Shattered Vales OS Home Edition (NVIDIA graphics)

# Built on Core Edition, which carries everything every edition shares
# (apps, branding, update and support tools, the release gate). Home adds
# Family Setup, the Welcome window, streaming bookmarks and its own
# branding on top.
base-image: ghcr.io/shattered-vales-studio/shatteredvales-os-core-nvidia
# Core's promoted image: Core changes reach Home only after Core's own
# canary week, then go through Home's :testing like any other change.
# The Fedora release follows Core.
image-version: latest
# Builds from main publish only :testing (canary machines). The
# promote-images workflow moves :latest, which every other machine runs.
alt-tags:
  - testing

modules:
  - from-file: common/files.yml
  - from-file: common/branding.yml
  - from-file: common/finalize.yml
