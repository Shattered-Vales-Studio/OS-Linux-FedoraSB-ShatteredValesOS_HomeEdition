---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Shattered Vales OS Home Edition for machines with NVIDIA graphics.
# All shared configuration lives in recipes/common so the base and NVIDIA
# images can never drift apart; only the base image differs.
name: shatteredvales-os-home-nvidia
description: Shattered Vales OS Home Edition (NVIDIA graphics)

# BlueBuild's NVIDIA base ships prebuilt, signed kernel modules, which is
# what removes the post-install driver pain on Fedora. The open kernel
# modules support Turing (RTX 20xx / GTX 16xx) and newer; older cards need
# fedora-silverblue-nvidia (580 driver series) instead.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
# Pinned so a Fedora major release is an explicit, tested change rather than
# something that lands on every machine overnight.
image-version: 45
# Builds from main publish only :testing (canary machines). The
# promote-images workflow moves :latest, which every other machine runs.
alt-tags:
  - testing

modules:
  - from-file: common/files.yml
  - from-file: common/packages.yml
  - from-file: common/extras.yml
  - from-file: common/desktop.yml
  - from-file: common/branding.yml
  - from-file: common/flatpaks.yml
  - from-file: common/services.yml
  - from-file: common/finalize.yml
